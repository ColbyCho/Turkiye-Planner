name: Fetch candidate sight photos

# Manual only. Collects several Wikimedia Commons candidates per subject and
# commits them to the branch it ran on, so they can be reviewed before any of
# them goes in front of the crew. Run this on a scratch branch — the winners
# are committed separately and the candidates are never merged.

on:
  workflow_dispatch:

jobs:
  photos:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: turkiye-planner/package-lock.json

      - name: Install
        working-directory: turkiye-planner
        run: npm ci

      - name: Fetch candidates
        working-directory: turkiye-planner
        run: npm run photos

      - name: Commit the candidates
        run: |
          if [ -z "$(git status --porcelain turkiye-planner/public/sights)" ]; then
            echo "No candidates fetched."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add turkiye-planner/public/sights
          git commit -m "Candidate sight photos for review"
          git push origin HEAD:${{ github.ref_name }}
