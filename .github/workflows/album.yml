name: Snapshot the shared album

# Pulls the crew's iCloud shared album into the repo so trip photos show up on
# their own day's page. Apple's image links expire within the hour, so the
# planner can't hold them — this commits the bytes instead.

on:
  schedule:
    # Every two hours while the trip is on. GitHub runs these on UTC.
    - cron: '0 */2 * * *'
  workflow_dispatch:

# One run at a time, or two runs race to commit the same photos.
concurrency:
  group: album-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: turkiye-planner/package-lock.json

      - name: Install
        working-directory: turkiye-planner
        run: npm ci

      - name: Snapshot the album
        working-directory: turkiye-planner
        run: npm run album

      - name: Commit anything new
        run: |
          if [ -z "$(git status --porcelain turkiye-planner/public/album)" ]; then
            echo "Album unchanged."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add turkiye-planner/public/album
          git commit -m "Snapshot the shared album"
          git push
